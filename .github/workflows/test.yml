name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
        if: runner.os != 'Windows'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -cover ./...
      - name: Build
        run: go build ./...
